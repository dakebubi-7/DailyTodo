name: Feature request

description: Suggest a focused improvement for DailyTodo
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow or user problem would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: language
    attributes:
      label: Documentation language
      options:
        - 简体中文
        - English
        - Both
    validations:
      required: true
