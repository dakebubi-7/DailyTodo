<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DailyTodo 图标方案预览</title>
<style>
  body { margin: 0; padding: 40px; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #f4f5f3; color: #2c2c2c; }
  h1 { font-weight: 800; }
  .row { display: flex; gap: 40px; flex-wrap: wrap; margin-top: 24px; }
  .card { background: #fff; border-radius: 18px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.08);
          text-align: center; }
  .name { font-weight: 700; margin-bottom: 16px; }
  .big img { width: 180px; height: 180px; }
  .sizes { display: flex; align-items: flex-end; gap: 16px; justify-content: center; margin-top: 18px; }
  .sizes img { display: block; }
  .s64 { width: 64px; height: 64px; }
  .s32 { width: 32px; height: 32px; }
  .s16 { width: 16px; height: 16px; }
  .cap { font-size: 12px; color: #888; margin-top: 4px; }
  .dark { background:#1c1c1e; }
  .dark .card { background:#2c2c2e; color:#eee; }
</style>
</head>
<body>
  <h1>DailyTodo 图标方案（莫兰迪渐变 · 苹果风格）</h1>
  <p>三个方案并排。重点看右侧的小尺寸——做应用/桌面图标时大多是小图，辨识度最重要。</p>
  <div class="row">
    <div class="card">
      <div class="name">方案 ① DT 字母</div>
      <div class="big"><img src="dt-letters.svg"></div>
      <div class="sizes">
        <div><img class="s64" src="dt-letters.svg"><div class="cap">64</div></div>
        <div><img class="s32" src="dt-letters.svg"><div class="cap">32</div></div>
        <div><img class="s16" src="dt-letters.svg"><div class="cap">16</div></div>
      </div>
    </div>
    <div class="card">
      <div class="name">方案 ② DT + 对勾</div>
      <div class="big"><img src="dt-check.svg"></div>
      <div class="sizes">
        <div><img class="s64" src="dt-check.svg"><div class="cap">64</div></div>
        <div><img class="s32" src="dt-check.svg"><div class="cap">32</div></div>
        <div><img class="s16" src="dt-check.svg"><div class="cap">16</div></div>
      </div>
    </div>
    <div class="card">
      <div class="name">方案 ③ 清单对勾</div>
      <div class="big"><img src="check-list.svg"></div>
      <div class="sizes">
        <div><img class="s64" src="check-list.svg"><div class="cap">64</div></div>
        <div><img class="s32" src="check-list.svg"><div class="cap">32</div></div>
        <div><img class="s16" src="check-list.svg"><div class="cap">16</div></div>
      </div>
    </div>
  </div>
</body>
</html>
