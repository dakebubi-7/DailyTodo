<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dtBlue" x1="150" y1="200" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E3FC4"/>
      <stop offset="0.55" stop-color="#5A6FBE"/>
      <stop offset="1" stop-color="#BCC2D2"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2a2a35" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 圆角白底卡片 -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="#FCFCFD" filter="url(#cardShadow)"/>
  <rect x="41" y="41" width="430" height="430" rx="103" stroke="#E6E7EC" stroke-width="2"/>

  <g stroke="url(#dtBlue)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 半圆太阳(开口朝下) -->
    <path d="M178 268 A82 82 0 0 1 342 268"/>
    <!-- 对勾(承接太阳底部,长臂上扬) -->
    <path d="M214 300 L300 384 L432 244"/>

    <!-- 光线 -->
    <line x1="260" y1="120" x2="260" y2="160"/>
    <line x1="170" y1="158" x2="196" y2="184"/>
    <line x1="350" y1="158" x2="324" y2="184"/>
    <line x1="120" y1="268" x2="160" y2="268"/>
    <line x1="150" y1="358" x2="176" y2="332"/>
  </g>
</svg>
